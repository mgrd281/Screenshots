# Builds Snapfly on GitHub's Macs at every push, so nobody needs a
# Terminal to get it: the app is published as a download on the
# Releases page, "latest" from main and "preview" from any other branch.
name: Build Snapfly

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      # Once the owner has run scripts/mac-signing.sh, builds are signed
      # with the Developer ID, and those from main are notarized by Apple
      # too, so they open without a warning. Until then, signed ad hoc.
      CAN_SIGN: ${{ secrets.SNAPFLY_SIGNING != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the translations
        run: swift scripts/check-strings.swift

      - name: Check the App Store scripts
        run: |
          swiftc -typecheck scripts/asc.swift
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Get the Developer ID
        if: env.CAN_SIGN == 'true'
        env:
          SNAPFLY_SIGNING: ${{ secrets.SNAPFLY_SIGNING }}
        run: scripts/signing.sh developer-id

      - name: Build Snapfly.app
        run: scripts/build-app.sh

      - name: Notarize
        if: env.SIGN_IDENTITY != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          SNAPFLY_SIGNING: ${{ secrets.SNAPFLY_SIGNING }}
        run: scripts/signing.sh notarize build/Snapfly.app

      - name: Pack it
        run: ditto -c -k --keepParent build/Snapfly.app Snapfly.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Snapfly
          path: Snapfly.zip

      - name: Publish the download
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG=latest; TITLE="Snapfly"; FLAGS=""
          else
            TAG=preview; TITLE="Snapfly (preview)"; FLAGS="--prerelease"
          fi
          # Notarized, it opens like any app from the internet.
          if [ "${NOTARIZED:-}" = "true" ]; then
            FIRST_TIME="3. Signed and checked by Apple: the first time, macOS asks once, and you click Open."
          else
            FIRST_TIME="3. The first time, macOS says it cannot check the app: open System Settings › Privacy & Security, scroll down and click Open Anyway."
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" Snapfly.zip --target "$GITHUB_SHA" --title "$TITLE" $FLAGS \
            --notes "Built from ${GITHUB_SHA::7} on $GITHUB_REF_NAME.

          1. Download Snapfly.zip and open it.
          2. Drag Snapfly to the Applications folder and open it.
          $FIRST_TIME"

      - name: Remove the signing keychain
        if: always()
        run: scripts/signing.sh cleanup
