# Builds Snapfly on GitHub's Macs at every push, so nobody needs a
# Terminal to get it: the app is published as a download on the
# Releases page, "latest" from main and "preview" from any other branch.
name: Build Snapfly

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      # Once the owner has run scripts/mac-signing.sh, builds are signed
      # with the Developer ID, and those from main are notarized by Apple
      # too, so they open without a warning. Until then, signed ad hoc.
      CAN_SIGN: ${{ secrets.SNAPFLY_SIGNING != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the translations
        run: swift scripts/check-strings.swift

      - name: Run the tests
        run: swift test

      - name: Check the App Store edition
        run: |
          swift build -Xswiftc -DAPP_STORE
          scripts/check-private-apis.sh "$(swift build -Xswiftc -DAPP_STORE --show-bin-path)/Tendedero"

      - name: Check the App Store scripts
        run: |
          swiftc -typecheck scripts/asc.swift
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Get the Developer ID
        if: env.CAN_SIGN == 'true'
        env:
          SNAPFLY_SIGNING: ${{ secrets.SNAPFLY_SIGNING }}
        run: scripts/signing.sh developer-id

      # The profile that lets this build use the owner's iCloud, to sync
      # with the iPhone. If it cannot be had, the build leaves syncing out.
      - name: Get the iCloud profile
        if: env.CAN_SIGN == 'true'
        continue-on-error: true
        env:
          SNAPFLY_SIGNING: ${{ secrets.SNAPFLY_SIGNING }}
        run: scripts/signing.sh cloud-profile

      # Each build has its own number, so a report names the very build.
      # With the owner's Cloudflare account set up, Copy Link is in the app.
      - name: Build Snapfly.app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/build-app.sh

      - name: Notarize
        if: env.SIGN_IDENTITY != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          SNAPFLY_SIGNING: ${{ secrets.SNAPFLY_SIGNING }}
        run: scripts/signing.sh notarize build/Snapfly.app

      - name: Pack it
        run: ditto -c -k --keepParent build/Snapfly.app Snapfly.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Snapfly
          path: Snapfly.zip

      - name: Publish the download
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG=latest; TITLE="Snapfly"; FLAGS=""
          else
            TAG=preview; TITLE="Snapfly (preview)"; FLAGS="--prerelease"
          fi
          # Notarized, it opens like any app from the internet.
          if [ "${NOTARIZED:-}" = "true" ]; then
            FIRST_TIME="3. Signed and checked by Apple: the first time, macOS asks once, and you click Open."
          else
            FIRST_TIME="3. The first time, macOS says it cannot check the app: open System Settings › Privacy & Security, scroll down and click Open Anyway."
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          # What this version brings, from its section of CHANGELOG.md.
          NEWS="$(awk -v heading="## $VERSION" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md)"
          NOTES="Snapfly $VERSION, built from ${GITHUB_SHA::7} on $GITHUB_REF_NAME.
          $NEWS

          1. Download Snapfly.zip and open it.
          2. Drag Snapfly to the Applications folder and open it.
          $FIRST_TIME"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" Snapfly.zip --target "$GITHUB_SHA" --title "$TITLE" $FLAGS --notes "$NOTES"
          # Each version also keeps a release of its own, with its newest
          # build, beside the one that always moves to the newest.
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            gh release delete "v$VERSION" --yes --cleanup-tag || true
            gh release create "v$VERSION" Snapfly.zip --target "$GITHUB_SHA" --title "Snapfly $VERSION" \
              --latest=false --notes "$NOTES"
          fi

      - name: Remove the signing keychain
        if: always()
        run: scripts/signing.sh cleanup

  # The iPhone app (iOS/), built for a device but not signed, so a change to
  # the code both apps share is checked on the iPhone too.
  iphone:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Archived the way the iPhone App Store workflow does it, unsigned.
      - name: Build the iPhone app
        run: |
          xcodebuild -project iOS/Snapfly.xcodeproj -scheme Snapfly -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/iphone/Snapfly.xcarchive \
            MARKETING_VERSION="$(tr -d '[:space:]' < VERSION)" CODE_SIGNING_ALLOWED=NO -quiet archive
          test -f build/iphone/Snapfly.xcarchive/Products/Applications/Snapfly.app/PrivacyInfo.xcprivacy
          # The share extension rides inside the app, with its own privacy manifest.
          test -f build/iphone/Snapfly.xcarchive/Products/Applications/Snapfly.app/PlugIns/SnapflyShare.appex/PrivacyInfo.xcprivacy
