# Builds the Mac App Store edition and uploads it to App Store Connect,
# where it shows in TestFlight once Apple has processed it. It runs for
# every change to the app that lands on main, so TestFlight always has the
# newest; it can also be run by hand from the Actions tab.
# scripts/app-store.sh lists what it needs.
name: App Store

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "assets/**"
      - "scripts/build-app.sh"
      - "scripts/app-store.sh"
      - "VERSION"
  workflow_dispatch:

# One upload at a time, each with a higher build number than the last.
concurrency:
  group: app-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-latest
    env:
      SNAPFLY_SIGNING: ${{ secrets.SNAPFLY_SIGNING }}
      SNAPFLY_STORE: ${{ secrets.SNAPFLY_STORE }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the translations
        run: swift scripts/check-strings.swift

      - name: Build, sign and upload
        run: scripts/app-store.sh

      - name: Remove the keychain and files
        if: always()
        run: scripts/app-store.sh cleanup
