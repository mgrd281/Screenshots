# Builds the Mac App Store edition and uploads it to App Store Connect,
# where it shows in TestFlight once Apple has processed it. Run it from the
# Actions tab, or ask Claude; scripts/app-store.sh lists what it needs.
name: App Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-latest
    env:
      SNAPFLY_SIGNING: ${{ secrets.SNAPFLY_SIGNING }}
      SNAPFLY_STORE: ${{ secrets.SNAPFLY_STORE }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the translations
        run: swift scripts/check-strings.swift

      - name: Build, sign and upload
        run: scripts/app-store.sh

      - name: Remove the keychain and files
        if: always()
        run: scripts/app-store.sh cleanup
