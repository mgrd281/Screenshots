<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snapfly ad</title>
<link rel="stylesheet" href="fonts.css">
<style>
  /* The Instagram ad: a 1080 × 1920 stage drawn frame by frame by seek(t),
     timed to the voice. Nothing animates on its own. */
  html, body { margin: 0; background: #0A0710; }
  body { width: 1080px; height: 1920px; overflow: hidden; position: relative;
         font-family: Inter, system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; }
  .abs { position: absolute; }

  #bg { background: #0A0710; }
  .blob { position: absolute; border-radius: 50%; }
  #blobA { width: 1500px; height: 1500px; left: -620px; top: -560px;
           background: radial-gradient(closest-side, rgba(255,150,80,.5), rgba(255,94,98,.16) 55%, rgba(255,94,98,0)); }
  #blobB { width: 1600px; height: 1600px; left: 220px; top: 1000px;
           background: radial-gradient(closest-side, rgba(178,52,214,.5), rgba(178,52,214,.14) 55%, rgba(178,52,214,0)); }
  .wallpaper { background:
            radial-gradient(95% 60% at 0% 0%, rgba(255,196,92,.95), rgba(255,196,92,0) 62%),
            radial-gradient(80% 55% at 100% 100%, rgba(178,52,214,.95), rgba(178,52,214,0) 72%),
            linear-gradient(160deg, #FF8A5C 0%, #FF5E62 40%, #D9449A 72%, #B234D6 100%); }
  #wallWash { background: linear-gradient(to bottom, rgba(42,10,51,.05) 20%, rgba(42,10,51,.5) 100%); }

  /* Captions: the spoken words, a chunk at a time, big enough to read with
     the sound off. The key words carry the brand gradient. */
  .kin { position: absolute; left: 40px; right: 40px; top: 210px; text-align: center; }
  .kin .ln { display: block; font-size: 116px; font-weight: 800; line-height: 1.02; letter-spacing: -0.04em; }
  .kin .ln.small { font-size: 70px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 6px; }
  .kin .w { display: inline-block; white-space: pre; }
  .grad { background: linear-gradient(95deg, #FFC45C 0%, #FF7A59 38%, #FF5E62 58%, #D25BF0 100%);
          -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .04em; }

  .screen { position: absolute; border-radius: 30px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.6); transform-origin: 50% 0; }
  .menubar { position: absolute; left: 0; right: 0; top: 0; height: 40px; background: rgba(255,255,255,.45); }
  .menubar i { position: absolute; top: 15px; height: 10px; border-radius: 5px; background: rgba(0,0,0,.42); }
  .mark { position: absolute; top: 6px; width: 28px; height: 28px; color: #1A0E1F; }
  .mark svg { width: 100%; height: 100%; overflow: visible; }
  .glow { position: absolute; width: 120px; height: 120px; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0)); }
  .file { position: absolute; width: 104px; transform-origin: 50% 0; }
  .file .thumb { width: 84px; margin: 0 auto; border: 3px solid #fff; border-radius: 6px; overflow: hidden;
                 box-shadow: 0 3px 8px rgba(0,0,0,.35); background: #fff; }
  .file .thumb svg, .card .img svg, .app .pic svg { display: block; width: 100%; height: auto; }
  .file .name { margin-top: 4px; font-size: 12px; line-height: 1.2; text-align: center; color: #fff;
                text-shadow: 0 1px 3px rgba(0,0,0,.7); font-weight: 500; }
  .rope { position: absolute; overflow: visible; }
  .rope path { fill: none; stroke: #3A2A3E; stroke-width: 3; stroke-linecap: round; }
  .rope.light path { stroke: #EADFF2; }

  .card { position: absolute; transform-origin: 50% 0; }
  .card .glass { padding: 6px; border-radius: 20px; background: rgba(255,255,255,.62);
                 border: 1px solid rgba(255,255,255,.8); box-shadow: 0 10px 22px rgba(0,0,0,.35); }
  .card .img { border-radius: 14px; overflow: hidden; }
  .clip { position: absolute; left: 50%; top: -18px; width: 16px; height: 38px; margin-left: -8px; border-radius: 4px; z-index: 2;
          background: linear-gradient(90deg, #A9AEB8, #F4F5F8 45%, #8E949F); box-shadow: 0 2px 3px rgba(0,0,0,.4); }
  .send { position: absolute; right: -14px; bottom: -14px; width: 54px; height: 54px; border-radius: 50%; background: #0071E3;
          border: 3px solid rgba(255,255,255,.9); box-shadow: 0 4px 10px rgba(0,0,0,.35); }
  .send svg { width: 28px; height: 28px; margin: 10px; }
  .ripple { position: absolute; border-radius: 50%; border: 6px solid rgba(255,255,255,.9); }
  .pointer { position: absolute; width: 76px; height: 76px; }

  /* The three chats, after the apps' own layout and colours, without their
     logos. */
  .app { position: absolute; border-radius: 30px; overflow: hidden; display: flex; flex-direction: column;
         box-shadow: 0 40px 90px rgba(0,0,0,.6); transform-origin: 50% 40%; }
  .app .top { flex: none; height: 76px; display: flex; align-items: center; gap: 16px; padding: 0 26px;
              border-bottom: 1px solid rgba(0,0,0,.07); font-size: 28px; }
  .app .lights { margin-inline-end: 14px; }
  .app .thread { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 26px 28px; overflow: hidden; }
  .app .me { align-self: flex-end; max-width: 330px; }
  .app .pic { width: 300px; border-radius: 18px; overflow: hidden; }
  .app .ask { flex: none; margin: 0 22px 22px; height: 84px; display: flex; align-items: center; justify-content: space-between;
              padding: 0 14px 0 28px; font-size: 27px; }
  .app .go { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; }
  .app .go svg { width: 30px; height: 30px; }

  .claude { background: #FAF9F5; color: #2B2A27; }
  .claude .name { font-weight: 600; }
  .claude .me { background: #F0EEE6; border-radius: 22px; padding: 10px; }
  .claude .said { padding: 12px 8px 4px; font-size: 27px; line-height: 1.35; }
  .claude .reply { font-family: "Bitstream Charter", Charter, Georgia, "Liberation Serif", serif; font-size: 30px; line-height: 1.45; max-width: 92%; }
  .claude .ask { background: #FFFFFF; border: 1.5px solid #E3E0D6; border-radius: 26px; color: #8C887E;
                 box-shadow: 0 4px 14px rgba(60,50,30,.06); }
  .claude .go { background: #C96442; color: #fff; border-radius: 14px; }

  .wa { background: #EFEAE2; color: #111B21; }
  .wa .top { background: #F0F2F5; }
  .wa .avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #C9CFD4, #9AA4AC); }
  .wa .who { display: flex; flex-direction: column; line-height: 1.2; }
  .wa .who b { font-size: 28px; font-weight: 600; }
  .wa .who small { font-size: 21px; color: #667781; }
  .wa .in, .wa .me { position: relative; border-radius: 14px; box-shadow: 0 1px 1px rgba(0,0,0,.12); font-size: 28px; line-height: 1.35; }
  .wa .in { align-self: flex-start; background: #FFFFFF; padding: 12px 18px 26px; max-width: 78%; }
  .wa .me { background: #D9FDD3; padding: 6px 6px 30px; }
  .wa .thread small { position: absolute; right: 14px; bottom: 6px; font-size: 18px; color: #667781; display: flex; align-items: center; gap: 4px; }
  .wa .ticks { width: 24px; color: #53BDEB; display: inline-flex; }
  .wa .ticks svg { width: 24px; height: 15px; }
  .wa .pic { border-radius: 10px; }
  .wa .ask { background: #F0F2F5; margin: 0; height: 104px; padding: 0 22px; border-top: 1px solid rgba(0,0,0,.06); }
  .wa .field { flex: 1; background: #FFFFFF; border-radius: 30px; height: 64px; display: flex; align-items: center; padding: 0 26px; color: #667781; }

  .gpt { background: #FFFFFF; color: #0D0D0D; }
  .gpt .top { border-bottom: 0; }
  .gpt .name { font-weight: 600; font-size: 30px; }
  .gpt .chev { color: #8F8F8F; font-size: 26px; }
  .gpt .me { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .gpt .said { background: #F4F4F4; border-radius: 26px; padding: 14px 24px; font-size: 27px; line-height: 1.35; }
  .gpt .reply { font-size: 28px; line-height: 1.5; max-width: 94%; }
  .gpt .ask { border: 1.5px solid #E3E3E3; border-radius: 40px; color: #8F8F8F; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
  .gpt .go { background: #0D0D0D; color: #fff; }
  .legal { position: absolute; left: 90px; right: 90px; text-align: center; font-size: 21px; line-height: 1.35; opacity: .8; }

  .doc { position: absolute; width: 860px; border-radius: 34px; background: #fff; color: #1D1D1F;
         box-shadow: 0 40px 90px rgba(0,0,0,.6); overflow: hidden; }
  .doc .bar { height: 54px; background: #F2F2F4; display: flex; align-items: center; padding: 0 22px; }
  .doc .body { padding: 30px 48px 56px; font-size: 34px; line-height: 1.65; }
  .doc .items { margin: 12px 0 6px; padding-top: 12px; border-top: 2px solid #E5E5EA; }
  .doc .items div { display: flex; justify-content: space-between; gap: 20px; }
  .doc .top { display: flex; justify-content: space-between; margin-bottom: 16px; }
  .doc .title { font-size: 44px; font-weight: 800; line-height: 1.2; }
  .doc .dim { color: #6E6E73; font-size: 27px; }
  .doc .label { color: #6E6E73; font-size: 23px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .pd { position: relative; display: inline-block; }
  .pd .mark-hl { position: absolute; left: -10px; right: -10px; top: 4%; bottom: 4%; border-radius: 10px;
                 background: rgba(255,196,92,.55); box-shadow: 0 0 0 3px rgba(255,140,60,.9); }
  .pd .ink { position: absolute; left: -6px; right: -6px; top: 10%; bottom: 10%; border-radius: 8px; background: #1F1F1F; transform-origin: 0 50%; }
  .lock { position: absolute; width: 84px; height: 84px; border-radius: 50%; background: rgba(0,0,0,.65); }
  .lock svg { width: 44px; height: 44px; margin: 20px; }

  .end-icon { position: absolute; width: 300px; height: 300px; }
  .end-word { position: absolute; left: 0; right: 0; text-align: center; font-size: 168px; font-weight: 800; letter-spacing: -0.04em; }
  .end-tag { position: absolute; left: 90px; right: 90px; text-align: center; font-size: 50px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
  .free { position: absolute; padding: 26px 58px; border-radius: 999px; background: #fff; color: #1D1D1F; font-size: 48px; font-weight: 800;
          box-shadow: 0 16px 40px rgba(40,0,50,.35); white-space: nowrap; }
  .url { position: absolute; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 600; opacity: .92; }
</style>
</head>
<body>
<script>
const DATA = /*DATA*/null;
</script>
<script src="ad.js"></script>
</body>
</html>
