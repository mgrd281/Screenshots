<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snapfly ad</title>
<link rel="stylesheet" href="fonts.css">
<style>
  /* The Instagram ad: a 1080 × 1920 stage drawn frame by frame by seek(t),
     timed to the voice. Nothing animates on its own. */
  html, body { margin: 0; background: #0A0710; }
  body { width: 1080px; height: 1920px; overflow: hidden; position: relative;
         font-family: Inter, system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; }
  .abs { position: absolute; }

  #bg { background: #0A0710; }
  .blob { position: absolute; border-radius: 50%; }
  #blobA { width: 1500px; height: 1500px; left: -620px; top: -560px;
           background: radial-gradient(closest-side, rgba(255,150,80,.5), rgba(255,94,98,.16) 55%, rgba(255,94,98,0)); }
  #blobB { width: 1600px; height: 1600px; left: 220px; top: 1000px;
           background: radial-gradient(closest-side, rgba(178,52,214,.5), rgba(178,52,214,.14) 55%, rgba(178,52,214,0)); }
  .wallpaper { background:
            radial-gradient(95% 60% at 0% 0%, rgba(255,196,92,.95), rgba(255,196,92,0) 62%),
            radial-gradient(80% 55% at 100% 100%, rgba(178,52,214,.95), rgba(178,52,214,0) 72%),
            linear-gradient(160deg, #FF8A5C 0%, #FF5E62 40%, #D9449A 72%, #B234D6 100%); }
  #wallWash { background: linear-gradient(to bottom, rgba(42,10,51,.05) 20%, rgba(42,10,51,.5) 100%); }

  /* Captions: the spoken words, a chunk at a time, big enough to read with
     the sound off. The key words carry the brand gradient. */
  .kin { position: absolute; left: 40px; right: 40px; top: 210px; text-align: center; }
  .kin .ln { display: block; font-size: 116px; font-weight: 800; line-height: 1.02; letter-spacing: -0.04em; }
  .kin .ln.small { font-size: 70px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 6px; }
  .kin .w { display: inline-block; white-space: pre; }
  .grad { background: linear-gradient(95deg, #FFC45C 0%, #FF7A59 38%, #FF5E62 58%, #D25BF0 100%);
          -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 .04em; }

  .screen { position: absolute; border-radius: 30px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.6); transform-origin: 50% 0; }
  .menubar { position: absolute; left: 0; right: 0; top: 0; height: 40px; background: rgba(255,255,255,.45); }
  .menubar i { position: absolute; top: 15px; height: 10px; border-radius: 5px; background: rgba(0,0,0,.42); }
  .mark { position: absolute; top: 6px; width: 28px; height: 28px; color: #1A0E1F; }
  .mark svg { width: 100%; height: 100%; overflow: visible; }
  .glow { position: absolute; width: 120px; height: 120px; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0)); }
  .file { position: absolute; width: 104px; transform-origin: 50% 0; }
  .file .thumb { width: 84px; margin: 0 auto; border: 3px solid #fff; border-radius: 6px; overflow: hidden;
                 box-shadow: 0 3px 8px rgba(0,0,0,.35); background: #fff; }
  .file .thumb svg, .card .img svg, .app .pic svg { display: block; width: 100%; height: auto; }
  .file .name { margin-top: 4px; font-size: 12px; line-height: 1.2; text-align: center; color: #fff;
                text-shadow: 0 1px 3px rgba(0,0,0,.7); font-weight: 500; }
  .rope { position: absolute; overflow: visible; }
  .rope path { fill: none; stroke: #3A2A3E; stroke-width: 3; stroke-linecap: round; }
  .rope.light path { stroke: #EADFF2; }

  .card { position: absolute; transform-origin: 50% 0; }
  .card .glass { padding: 6px; border-radius: 20px; background: rgba(255,255,255,.62);
                 border: 1px solid rgba(255,255,255,.8); box-shadow: 0 10px 22px rgba(0,0,0,.35); }
  .card .img { border-radius: 14px; overflow: hidden; }
  .clip { position: absolute; left: 50%; top: -18px; width: 16px; height: 38px; margin-left: -8px; border-radius: 4px; z-index: 2;
          background: linear-gradient(90deg, #A9AEB8, #F4F5F8 45%, #8E949F); box-shadow: 0 2px 3px rgba(0,0,0,.4); }
  .send { position: absolute; right: -14px; bottom: -14px; width: 54px; height: 54px; border-radius: 50%; background: #0071E3;
          border: 3px solid rgba(255,255,255,.9); box-shadow: 0 4px 10px rgba(0,0,0,.35); }
  .send svg { width: 28px; height: 28px; margin: 10px; }
  .ripple { position: absolute; border-radius: 50%; border: 6px solid rgba(255,255,255,.9); }
  .pointer { position: absolute; width: 76px; height: 76px; }

  /* The three chats, after the apps' own layout and colours, without their
     logos. */
  .app { position: absolute; border-radius: 30px; overflow: hidden; display: flex; flex-direction: column;
         box-shadow: 0 40px 90px rgba(0,0,0,.6); transform-origin: 50% 40%; }
  .app .top { flex: none; height: 76px; display: flex; align-items: center; gap: 16px; padding: 0 26px;
              border-bottom: 1px solid rgba(0,0,0,.07); font-size: 28px; }
  .lights { display: flex; gap: 10px; margin-inline-end: 14px; }
  .lights i { width: 16px; height: 16px; border-radius: 50%; background: #FF5F57; }
  .lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
  .app .thread { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 26px 28px; overflow: hidden; }
  .app .me { align-self: flex-end; max-width: 330px; }
  .app .pic { width: 300px; border-radius: 18px; overflow: hidden; }
  .app .ask { flex: none; margin: 0 22px 22px; height: 84px; display: flex; align-items: center; justify-content: space-between;
              padding: 0 14px 0 28px; font-size: 27px; }
  .app .go { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; }
  .app .go svg { width: 30px; height: 30px; }

  .claude { background: #FAF9F5; color: #2B2A27; }
  .claude .name { font-weight: 600; }
  .claude .me { background: #F0EEE6; border-radius: 22px; padding: 10px; }
  .claude .said { padding: 12px 8px 4px; font-size: 27px; line-height: 1.35; }
  .claude .reply { font-family: "Bitstream Charter", Charter, Georgia, "Liberation Serif", serif; font-size: 30px; line-height: 1.45; max-width: 92%; }
  .claude .ask { background: #FFFFFF; border: 1.5px solid #E3E0D6; border-radius: 26px; color: #8C887E;
                 box-shadow: 0 4px 14px rgba(60,50,30,.06); }
  .claude .go { background: #C96442; color: #fff; border-radius: 14px; }

  /* WhatsApp as on the Mac: the chat list on the left, the conversation
     with Lena on the right, her messages white, ours green. */
  .wa { flex-direction: row; background: #FFFFFF; color: #111B21; }
  .wa .side { flex: none; width: 300px; display: flex; flex-direction: column; border-right: 1px solid #E9EDEF; }
  .wa .side-top { height: 86px; display: flex; align-items: center; padding: 0 24px; font-size: 32px; }
  .wa .side-top b { font-weight: 700; }
  .wa .search { margin: 0 18px 12px; height: 54px; border-radius: 14px; background: #F0F2F5; color: #667781;
                display: flex; align-items: center; padding: 0 20px; font-size: 23px; }
  .wa .row { display: flex; align-items: center; gap: 14px; height: 96px; padding: 0 16px 0 18px; }
  .wa .row.on { background: #F0F2F5; }
  .wa .row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid #E9EDEF;
                  padding: 14px 0; }
  .wa .row b { font-size: 24px; font-weight: 600; }
  .wa .row small { font-size: 20px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wa .when { align-self: flex-start; margin-top: 22px; font-size: 18px; color: #667781; }
  .wa .av { flex: none; width: 58px; height: 58px; border-radius: 50%; color: #fff; font-size: 26px; font-weight: 700;
            display: grid; place-items: center; }
  .wa .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #EFEAE2; }
  .wa .head { flex: none; height: 86px; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: #F0F2F5;
              border-bottom: 1px solid #E9EDEF; }
  .wa .head .av { width: 54px; height: 54px; }
  .wa .who { display: flex; flex-direction: column; line-height: 1.2; }
  .wa .who b { font-size: 27px; font-weight: 600; }
  .wa .who small { display: grid; font-size: 20px; color: #667781; }
  .wa .who small span { grid-area: 1 / 1; }
  .wa .typing { color: #1DAA61; }
  .wa .msgs { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
              padding: 0 30px 16px; }
  .wa .msgs > * { flex: none; }
  .wa .slot { overflow: hidden; display: flex; flex-direction: column; }
  .wa .day { align-self: center; margin-bottom: 4px; padding: 6px 16px; border-radius: 10px; background: #FFFFFF;
             font-size: 19px; color: #54656F; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
  .wa .in, .wa .out { position: relative; margin-top: 12px; border-radius: 14px; box-shadow: 0 1px 1px rgba(0,0,0,.12);
                      font-size: 26px; line-height: 1.35; padding: 10px 16px 30px; max-width: 82%; }
  .wa .in { align-self: flex-start; background: #FFFFFF; border-top-left-radius: 4px; }
  .wa .out { align-self: flex-end; background: #D9FDD3; border-top-right-radius: 4px; }
  .wa .in small, .wa .out small { position: absolute; right: 14px; bottom: 6px; font-size: 17px; color: #667781;
                                  display: flex; align-items: center; gap: 4px; }
  .wa .ticks { display: inline-flex; color: #53BDEB; }
  .wa .ticks svg { width: 23px; height: 14px; }
  .wa .out.me { padding: 5px; transform-origin: 100% 50%; }
  .wa .me .pic { width: 380px; border-radius: 10px; }
  .wa .me::after { content: ""; position: absolute; left: 5px; right: 5px; bottom: 5px; height: 64px; border-radius: 0 0 10px 10px;
                   background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.4)); }
  .wa .me small { z-index: 1; right: 16px; bottom: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .wa .me .ticks { filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  .wa .bar { flex: none; height: 96px; display: flex; align-items: center; gap: 18px; padding: 0 22px; background: #F0F2F5; }
  .wa .plus { width: 44px; text-align: center; font-size: 46px; font-weight: 300; line-height: 1; color: #54656F; }
  .wa .field { flex: 1; height: 62px; display: flex; align-items: center; padding: 0 24px; border-radius: 14px;
               background: #FFFFFF; color: #667781; font-size: 24px; }
  .wa .mic { width: 44px; height: 44px; color: #54656F; }
  .wa .mic svg { width: 100%; height: 100%; }

  .gpt { background: #FFFFFF; color: #0D0D0D; }
  .gpt .top { border-bottom: 0; }
  .gpt .name { font-weight: 600; font-size: 30px; }
  .gpt .chev { color: #8F8F8F; font-size: 26px; }
  .gpt .me { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .gpt .said { background: #F4F4F4; border-radius: 26px; padding: 14px 24px; font-size: 27px; line-height: 1.35; }
  .gpt .reply { font-size: 28px; line-height: 1.5; max-width: 94%; }
  .gpt .ask { border: 1.5px solid #E3E3E3; border-radius: 40px; color: #8F8F8F; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
  .gpt .go { background: #0D0D0D; color: #fff; }
  .legal { position: absolute; left: 90px; right: 90px; text-align: center; font-size: 21px; line-height: 1.35; opacity: .8; }

  .doc { position: absolute; width: 860px; border-radius: 34px; background: #fff; color: #1D1D1F;
         box-shadow: 0 40px 90px rgba(0,0,0,.6); overflow: hidden; }
  .doc .bar { height: 54px; background: #F2F2F4; display: flex; align-items: center; padding: 0 22px; }
  .doc .body { padding: 30px 48px 56px; font-size: 34px; line-height: 1.65; }
  .doc .items { margin: 12px 0 6px; padding-top: 12px; border-top: 2px solid #E5E5EA; }
  .doc .items div { display: flex; justify-content: space-between; gap: 20px; }
  .doc .top { display: flex; justify-content: space-between; margin-bottom: 16px; }
  .doc .title { font-size: 44px; font-weight: 800; line-height: 1.2; }
  .doc .dim { color: #6E6E73; font-size: 27px; }
  .doc .label { color: #6E6E73; font-size: 23px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .pd { position: relative; display: inline-block; }
  .pd .mark-hl { position: absolute; left: -10px; right: -10px; top: 4%; bottom: 4%; border-radius: 10px;
                 background: rgba(255,196,92,.55); box-shadow: 0 0 0 3px rgba(255,140,60,.9); }
  .pd .ink { position: absolute; left: -6px; right: -6px; top: 10%; bottom: 10%; border-radius: 8px; background: #1F1F1F; transform-origin: 0 50%; }
  .lock { position: absolute; width: 84px; height: 84px; border-radius: 50%; background: rgba(0,0,0,.65); }
  .lock svg { width: 44px; height: 44px; margin: 20px; }

  /* The long cut: the invoice sent off, search, a PDF, a translation, the
     history and what stays on the Mac. */
  .doc .doc-send { top: 3px; right: 22px; bottom: auto; width: 44px; height: 44px; border-width: 2px; }
  .doc .doc-send svg { width: 24px; height: 24px; margin: 10px; }
  .sparkle { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; color: #fff;
             filter: drop-shadow(0 0 10px rgba(255,255,255,.9)); }
  .sparkle svg { width: 100%; height: 100%; }
  .find { position: absolute; left: 540px; top: 830px; width: 620px; height: 104px; box-sizing: border-box; border-radius: 52px;
          display: flex; align-items: center; gap: 18px; padding: 0 36px; font-size: 44px; font-weight: 600;
          background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.4); box-shadow: 0 16px 40px rgba(0,0,0,.35); }
  .find svg { flex: none; width: 46px; height: 46px; }
  .find .caret { width: 4px; height: 52px; margin-left: -14px; border-radius: 2px; background: #FFC45C; }
  .hit { position: absolute; left: 4%; top: 17%; width: 27%; height: 12.5%; border-radius: 5px; transform-origin: 0 50%;
         background: rgba(255,196,92,.45); box-shadow: 0 0 0 2.5px rgba(255,140,60,.95); }
  .big .hit { border-radius: 12px; box-shadow: 0 0 0 6px rgba(255,140,60,.95); }
  .pick { position: absolute; right: -12px; top: -12px; z-index: 3; width: 50px; height: 50px; border-radius: 50%;
          background: #0A84FF; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.35); }
  .pick svg { width: 26px; height: 26px; margin: 9px; }
  .key { position: absolute; width: 66px; height: 66px; border-radius: 14px; display: grid; place-items: center;
         background: rgba(255,255,255,.94); color: #1D1D1F; font-size: 38px; font-weight: 600; box-shadow: 0 6px 14px rgba(0,0,0,.35); }
  .pdf-tag { position: absolute; left: 540px; display: flex; align-items: center; gap: 20px; font-size: 40px; font-weight: 700; white-space: nowrap; }
  .pdf-tag b { padding: 8px 22px; border-radius: 12px; background: #E5383B; color: #fff; font-weight: 800; letter-spacing: .02em; }
  .tr .body { display: grid; gap: 26px; padding: 44px 54px 58px; }
  .swap { display: grid; }
  .swap > span { grid-area: 1 / 1; }
  .l-title { font-size: 52px; font-weight: 800; line-height: 1.15; }
  .l-body { font-size: 34px; line-height: 1.5; color: #3A3A3C; }
  .l-button > span > span { display: inline-block; padding: 14px 30px; border-radius: 14px; background: #0071E3; color: #fff;
                            font-size: 30px; font-weight: 700; }
  .lang-chip { position: absolute; left: 540px; top: 590px; padding: 14px 32px; border-radius: 999px; font-size: 36px; font-weight: 700;
               white-space: nowrap; background: rgba(255,255,255,.16); border: 1.5px solid rgba(255,255,255,.4); }
  .menu { position: absolute; width: 400px; padding: 10px; border-radius: 18px; transform-origin: 0 0; font-size: 30px;
          background: rgba(246,246,248,.97); color: #1D1D1F; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
  .menu div { padding: 12px 18px; border-radius: 10px; }
  .menu div.lit { background: #0A63D8; color: #fff; }
  .hist { position: absolute; width: 900px; border-radius: 30px; overflow: hidden; background: #fff; color: #1D1D1F;
          box-shadow: 0 40px 90px rgba(0,0,0,.6); }
  .hist .bar { position: relative; height: 72px; display: flex; align-items: center; padding: 0 26px; background: #F2F2F4; font-size: 30px; }
  .hist .bar b { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; }
  .hist .hsearch { margin: 22px 40px 4px; height: 60px; border-radius: 14px; display: flex; align-items: center; gap: 12px; padding: 0 20px;
                   background: #EFEFF2; color: #8A8A8E; font-size: 27px; }
  .hist .hsearch svg { width: 28px; height: 28px; }
  .hist .day { margin: 22px 40px 12px; font-size: 26px; font-weight: 700; color: #6E6E73; }
  .hist .row { display: flex; gap: 22px; padding: 0 40px; }
  .hist .row:last-child { padding-bottom: 38px; }
  .hist .th { width: 258px; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .hist .th svg { display: block; width: 100%; height: auto; }
  .days { position: absolute; display: flex; align-items: center; gap: 12px; padding: 16px 32px; border-radius: 999px; white-space: nowrap;
          font-size: 40px; font-weight: 800; color: #fff; background: linear-gradient(95deg, #FF8A5C, #FF5E62 55%, #D9449A);
          box-shadow: 0 14px 34px rgba(40,0,50,.45); }
  .days svg { width: 42px; height: 42px; }
  .tile { position: absolute; width: 260px; height: 260px; border-radius: 64px; display: grid; place-items: center; color: #fff;
          background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.28); box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  .tile > svg { grid-area: 1 / 1; width: 150px; height: 150px; }
  .tile .strike { width: 210px; height: 210px; }
  .tile .strike path { fill: none; stroke: #FF5E62; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 100; }
  .tile.mac { background: linear-gradient(160deg, rgba(255,138,92,.95), rgba(217,68,154,.95) 60%, rgba(178,52,214,.95));
              border-color: rgba(255,255,255,.6); }

  /* The long cut's newer scenes: the screenshot button, the button over
     the chat, an e-mail, what else it does, and the call at the end. */
  .app .album { display: flex; gap: 10px; }
  .app .album .pic { width: 250px; }
  .chatbtn { position: absolute; right: 26px; bottom: 122px; height: 84px; display: flex; align-items: center; gap: 14px; padding: 0 10px 0 14px;
             border-radius: 42px; background: rgba(250,250,252,.94); border: 1px solid rgba(0,0,0,.08); box-shadow: 0 10px 28px rgba(0,0,0,.22);
             transform-origin: 100% 100%; }
  .chatbtn .thumbs { position: relative; width: 76px; height: 64px; }
  .chatbtn .thumbs i { position: absolute; top: 2px; width: 60px; height: 60px; border-radius: 16px; overflow: hidden;
                       box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.25); }
  .chatbtn .thumbs i:first-child { left: 0; transform: rotate(-10deg); }
  .chatbtn .thumbs i:last-child { left: 14px; }
  .chatbtn .thumbs svg { display: block; width: 150%; height: 100%; margin-left: -25%; }
  .chatbtn b { font-size: 32px; font-weight: 700; color: #1D1D1F; font-variant-numeric: tabular-nums; }
  .chatbtn .cb-go { width: 64px; height: 64px; border-radius: 50%; background: #0A84FF; display: grid; place-items: center; }
  .chatbtn .cb-go > span { grid-area: 1 / 1; display: grid; place-items: center; }
  .chatbtn .cb-go svg { width: 32px; height: 32px; }
  .deskwin { position: absolute; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  .deskwin .bar { height: 26px; display: flex; align-items: center; padding: 0 10px; background: #F2F2F4; }
  .deskwin .lights { gap: 6px; }
  .deskwin .lights i { width: 10px; height: 10px; }
  .deskwin .img svg { display: block; width: 100%; height: auto; }
  .shotbtn { position: absolute; left: 912px; top: 364px; z-index: 8; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
             background: #0A84FF; box-shadow: 0 6px 16px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,255,255,.25); }
  .shotbtn svg { width: 34px; height: 34px; }
  .shotsel { position: absolute; z-index: 8; border: 2px solid #fff; background: rgba(255,255,255,.12); box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .cross { position: absolute; z-index: 9; width: 48px; height: 48px; filter: drop-shadow(0 0 1.5px rgba(0,0,0,.8)); }
  .cross svg { width: 100%; height: 100%; }
  .file.shot .thumb { width: 100%; border-width: 4px; border-radius: 10px; }
  .mail { position: absolute; width: 870px; border-radius: 28px; overflow: hidden; background: #fff; color: #1D1D1F;
          box-shadow: 0 40px 90px rgba(0,0,0,.6); }
  .mail .bar { height: 76px; display: flex; align-items: center; gap: 20px; padding: 0 28px; background: #F2F2F4; font-size: 30px; }
  .mail .bar b { font-weight: 700; }
  .mail .send-i { width: 40px; height: 40px; color: #0071E3; }
  .mail .send-i svg { width: 100%; height: 100%; }
  .mail .f { display: flex; align-items: center; gap: 14px; height: 68px; margin: 0 34px; border-bottom: 1.5px solid #E5E5EA; font-size: 29px; }
