<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Snapfly promo</title>
<link rel="stylesheet" href="fonts.css">
<style>
  /* A 1080 × 1920 stage, drawn frame by frame by seek(t). Nothing here
     animates on its own: every moving part is set from the timeline, so
     each frame renders the same every time. */
  html, body { margin: 0; background: #0A0710; }
  body { width: 1080px; height: 1920px; overflow: hidden; position: relative;
         font-family: Inter, system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  body.rtl { font-family: "Noto Sans Arabic", Inter, sans-serif; }
  /* Words read right to left; the stage itself keeps its left-to-right
     coordinates, and promo.js mirrors positions where it matters. */
  body.rtl .cap, body.rtl .doc, body.rtl .chat, body.rtl .menu, body.rtl .pill, body.rtl .switch,
  body.rtl .word, body.rtl .file .name, body.rtl .free { direction: rtl; }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; }
  .center { display: flex; align-items: center; justify-content: center; }

  #bg { background: #0A0710; }
  .blob { position: absolute; border-radius: 50%; }
  #blobA { width: 1500px; height: 1500px; left: -620px; top: -560px;
           background: radial-gradient(closest-side, rgba(255,150,80,.55), rgba(255,94,98,.18) 55%, rgba(255,94,98,0)); }
  #blobB { width: 1600px; height: 1600px; left: 220px; top: 1000px;
           background: radial-gradient(closest-side, rgba(178,52,214,.55), rgba(178,52,214,.15) 55%, rgba(178,52,214,0)); }
  #wall { background:
            radial-gradient(95% 60% at 0% 0%, rgba(255,196,92,.95), rgba(255,196,92,0) 62%),
            radial-gradient(80% 55% at 100% 100%, rgba(178,52,214,.95), rgba(178,52,214,0) 72%),
            linear-gradient(160deg, #FF8A5C 0%, #FF5E62 40%, #D9449A 72%, #B234D6 100%); }
  #wallWash { background: linear-gradient(to bottom, rgba(42,10,51,.05) 20%, rgba(42,10,51,.55) 100%); }

  .cap { position: absolute; left: 70px; right: 70px; top: 190px; text-align: center;
         font-size: 74px; font-weight: 800; line-height: 1.08; letter-spacing: -0.02em; text-wrap: balance; }
  body.rtl .cap { letter-spacing: 0; line-height: 1.35; font-size: 70px; }

  .streak { position: absolute; height: 6px; width: 900px; border-radius: 3px;
            background: linear-gradient(90deg, rgba(255,196,92,0), #FFC45C 30%, #FF5E62 60%, #C04BE0 85%, rgba(192,75,224,0));
            filter: drop-shadow(0 0 18px rgba(255,140,90,.9)); }
  .burst { position: absolute; width: 900px; height: 900px; border-radius: 50%;
           background: radial-gradient(closest-side, rgba(255,170,90,.75), rgba(255,94,98,.25) 45%, rgba(178,52,214,0)); }
  #icon { position: absolute; width: 380px; height: 380px; }
  .word { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; letter-spacing: -0.02em; }

  .screen { position: absolute; border-radius: 30px; overflow: hidden;
            box-shadow: 0 40px 90px rgba(0,0,0,.55); }
  .screen .wall { position: absolute; inset: 0; }
  .menubar { position: absolute; left: 0; right: 0; top: 0; height: 34px; background: rgba(255,255,255,.42); }
  .menubar i { position: absolute; top: 12px; height: 10px; border-radius: 5px; background: rgba(0,0,0,.42); }
  .file { position: absolute; width: 150px; transform-origin: 50% 0; }
  .file .thumb { width: 118px; margin: 0 auto; border: 3px solid #fff; border-radius: 6px; overflow: hidden;
                 box-shadow: 0 3px 8px rgba(0,0,0,.35); background: #fff; }
  .file .thumb svg, .card .img svg, .cell svg { display: block; width: 100%; height: auto; }
  .file .name { margin-top: 6px; font-size: 15px; line-height: 1.25; text-align: center; color: #fff;
                text-shadow: 0 1px 3px rgba(0,0,0,.7); font-weight: 500; }
  .rope { position: absolute; overflow: visible; }
  .rope path { fill: none; stroke: #4A3A4E; stroke-width: 3; stroke-linecap: round; }
  .rope.light path { stroke: #E9DDF0; }

  .card { position: absolute; transform-origin: 50% 0; }
  .card .glass { padding: 6px; border-radius: 22px; background: rgba(255,255,255,.6);
                 border: 1px solid rgba(255,255,255,.75); box-shadow: 0 10px 22px rgba(0,0,0,.35); }
  .card .img { border-radius: 16px; overflow: hidden; }
  .clip { position: absolute; left: 50%; top: -18px; width: 16px; height: 38px; margin-left: -8px; border-radius: 4px; z-index: 2;
          background: linear-gradient(90deg, #A9AEB8, #F4F5F8 45%, #8E949F); box-shadow: 0 2px 3px rgba(0,0,0,.4); }

  .doc { position: absolute; width: 860px; border-radius: 34px; background: #fff; color: #1D1D1F;
         box-shadow: 0 40px 90px rgba(0,0,0,.55); overflow: hidden; }
  .doc .bar { height: 54px; background: #F2F2F4; display: flex; align-items: center; gap: 12px; padding: 0 22px; }
  .lights { display: flex; gap: 12px; }
  .lights i { width: 18px; height: 18px; border-radius: 50%; background: #FF5F57; display: block; }
  .lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
  .doc .body { padding: 34px 48px 70px; font-size: 36px; line-height: 1.7; }
  .doc .items { margin: 14px 0 8px; padding-top: 14px; border-top: 2px solid #E5E5EA; }
  .doc .items div { display: flex; justify-content: space-between; gap: 20px; }
  .doc .top { display: flex; justify-content: space-between; margin-bottom: 18px; }
  .doc .title { font-size: 48px; font-weight: 800; line-height: 1.2; }
  .doc .dim { color: #6E6E73; font-size: 28px; }
  .doc .label { color: #6E6E73; font-size: 24px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  body.rtl .doc .label { letter-spacing: 0; }
  .pd { position: relative; display: inline-block; }
  .pd .ink { position: absolute; left: -6px; right: -6px; top: 10%; bottom: 10%; border-radius: 8px; background: #1F1F1F; transform-origin: 0 50%; }
  body.rtl .pd .ink { transform-origin: 100% 50%; }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .lock { position: absolute; width: 74px; height: 74px; border-radius: 50%; background: rgba(0,0,0,.6); }
  .lock svg { width: 40px; height: 40px; margin: 17px; }
  .switch { position: absolute; display: flex; align-items: center; gap: 22px; padding: 18px 28px; border-radius: 26px;
            background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); font-size: 34px; font-weight: 700; }
  .switch .track { width: 92px; height: 54px; border-radius: 27px; background: rgba(255,255,255,.25); position: relative; }
  .switch .knob { position: absolute; top: 4px; left: 4px; width: 46px; height: 46px; border-radius: 50%; background: #fff;
                  box-shadow: 0 2px 6px rgba(0,0,0,.35); }

  .chat { position: absolute; border-radius: 34px; background: #fff; color: #1D1D1F; overflow: hidden;
          box-shadow: 0 40px 90px rgba(0,0,0,.55); }
  .chat .titlebar { height: 76px; display: flex; align-items: center; justify-content: center; position: relative;
                    border-bottom: 1px solid rgba(0,0,0,.08); font-size: 28px; font-weight: 700; }
  .chat .titlebar .lights { position: absolute; left: 26px; }
  body.rtl .chat .titlebar .lights { left: auto; right: 26px; }
  .bubble { position: absolute; padding: 18px 28px; border-radius: 34px; font-size: 34px; line-height: 1.3; max-width: 620px; }
  .bubble.in { background: #E9E9EB; color: #1D1D1F; }
  .typing { display: flex; gap: 10px; padding: 26px 30px; }
  .typing i { width: 16px; height: 16px; border-radius: 50%; background: #8E8E93; display: block; }
  .album { position: absolute; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; border-radius: 30px; overflow: hidden; }
  .cell { width: 100%; }
  .tag { position: absolute; width: 124px; height: 124px; border-radius: 50%; background: #0071E3;
         border: 6px solid rgba(255,255,255,.9); box-shadow: 0 16px 34px rgba(0,0,0,.4); }
  .tag svg { width: 56px; height: 56px; margin: 28px; }
  body.rtl .tag svg { transform: scaleX(-1); }
  .pill { position: absolute; padding: 12px 26px; border-radius: 999px; background: rgba(246,246,248,.95); color: #1D1D1F;
          font-size: 30px; font-weight: 700; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  .ripple { position: absolute; border-radius: 50%; border: 6px solid rgba(255,255,255,.9); }
  .pointer { position: absolute; width: 72px; height: 72px; }
  .ring { position: absolute; width: 120px; height: 120px; }
  .ring circle { fill: none; stroke: #fff; stroke-width: 8; stroke-linecap: round; }

  .menu { position: absolute; width: 540px; padding: 12px; border-radius: 26px; background: rgba(246,246,248,.96); color: #1D1D1F;
          box-shadow: 0 30px 70px rgba(0,0,0,.5); transform-origin: 0 0; }
  body.rtl .menu { transform-origin: 100% 0; }
  .menu .item { position: relative; height: 66px; display: flex; align-items: center; padding: 0 24px; font-size: 32px; border-radius: 14px; }
  .menu .sep { height: 2px; margin: 8px 24px; background: rgba(0,0,0,.1); }
  .menu .hl { position: absolute; left: 12px; right: 12px; height: 66px; border-radius: 14px; background: #0071E3; }
  .pdf { position: absolute; width: 230px; height: 300px; border-radius: 18px; background: #fff; box-shadow: 0 24px 50px rgba(0,0,0,.5); }
  .pdf .fold { position: absolute; right: 0; top: 0; width: 60px; height: 60px; background: linear-gradient(225deg, #0A0710 50%, #E5E5EA 50%); border-radius: 0 18px 0 0; }
  .pdf .lines i { display: block; height: 14px; border-radius: 7px; background: #E5E5EA; margin: 0 28px 14px; }
  .pdf .badge { position: absolute; left: 28px; bottom: 28px; padding: 8px 18px; border-radius: 12px; background: #FF3B30; color: #fff;
                font-size: 34px; font-weight: 800; letter-spacing: .02em; font-family: Inter, sans-serif; }

  .end-word { font-size: 156px; font-weight: 800; letter-spacing: -0.03em; }
  .end-tag { font-size: 54px; font-weight: 700; line-height: 1.2; text-wrap: balance; padding: 0 90px; }
  body.rtl .end-tag { line-height: 1.5; }
  .free { position: absolute; padding: 24px 54px; border-radius: 999px; background: #fff; color: #1D1D1F; font-size: 44px; font-weight: 800;
          box-shadow: 0 16px 40px rgba(40,0,50,.35); white-space: nowrap; }
  .url { font-size: 36px; font-weight: 600; opacity: .92; font-family: Inter, sans-serif; letter-spacing: 0; }
</style>
</head>
<body>
<script>
const DATA = /*DATA*/null;
</script>
<script src="promo.js"></script>
</body>
</html>
